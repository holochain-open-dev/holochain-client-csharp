name: Publish NuGet Packages

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}

      - name: Checkout NextGenSoftware-Libraries
        uses: actions/checkout@v4
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          path: NextGenSoftware-Libraries

      - name: Create Libraries symlink for project references
        shell: pwsh
        run: |
          # Project references use ../../NextGenSoftware-Libraries (works locally where repos are siblings).
          # On GitHub Actions the Libraries checkout lands inside GITHUB_WORKSPACE, so we create a
          # symlink one level up so the same relative path resolves on both local and CI.
          New-Item -ItemType SymbolicLink -Path "..\NextGenSoftware-Libraries" -Target "$env:GITHUB_WORKSPACE\NextGenSoftware-Libraries"
          Write-Host "Symlink created: ..\NextGenSoftware-Libraries -> $env:GITHUB_WORKSPACE\NextGenSoftware-Libraries"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build all projects
        shell: pwsh
        run: |
          $projects = @(
            "NextGenSoftware.Holochain.HoloNET.Client\NextGenSoftware.Holochain.HoloNET.Client.csproj",
            "NextGenSoftware.Holochain.HoloNET.ORM\NextGenSoftware.Holochain.HoloNET.ORM.csproj",
            "NextGenSoftware.Holochain.HoloNET.HDK\NextGenSoftware.Holochain.HoloNET.HDK.csproj",
            "NextGenSoftware.Holochain.HoloNET.HyperNET\NextGenSoftware.Holochain.HoloNET.HyperNET.csproj",
            "HoloNET-Manager\NextGenSoftware.Holochain.HoloNET.Manager\NextGenSoftware.Holochain.HoloNET.Manager.csproj",
            "HoloNET-API\NextGenSoftware.Holochain.HoloNET.API\NextGenSoftware.Holochain.HoloNET.API.csproj"
          )
          $failed = 0
          foreach ($proj in $projects) {
            Write-Host "Building $proj..."
            dotnet build $proj --configuration Release
            if ($LASTEXITCODE -ne 0) { $failed++; Write-Host "BUILD FAILED: $proj" }
          }
          if ($failed -gt 0) { exit 1 }

      - name: Pack all packages
        shell: pwsh
        run: |
          $nupkgsDir = ".\nupkgs"
          New-Item -ItemType Directory -Force -Path $nupkgsDir | Out-Null

          # Non-embedded packages (standard variants)
          $projects = @(
            "NextGenSoftware.Holochain.HoloNET.Client\NextGenSoftware.Holochain.HoloNET.Client.csproj",
            "NextGenSoftware.Holochain.HoloNET.ORM\NextGenSoftware.Holochain.HoloNET.ORM.csproj",
            "NextGenSoftware.Holochain.HoloNET.HDK\NextGenSoftware.Holochain.HoloNET.HDK.csproj",
            "NextGenSoftware.Holochain.HoloNET.HyperNET\NextGenSoftware.Holochain.HoloNET.HyperNET.csproj",
            "HoloNET-Manager\NextGenSoftware.Holochain.HoloNET.Manager\NextGenSoftware.Holochain.HoloNET.Manager.csproj",
            "HoloNET-API\NextGenSoftware.Holochain.HoloNET.API\NextGenSoftware.Holochain.HoloNET.API.csproj"
          )
          $succeeded = 0; $failed = 0
          foreach ($proj in $projects) {
            Write-Host "Packing $proj (non-embedded)..."
            dotnet pack $proj --configuration Release --output $nupkgsDir --no-build
            if ($LASTEXITCODE -eq 0) { $succeeded++ } else { $failed++; Write-Host "FAILED: $proj" }
          }

          # Embedded variants for Client and ORM (include Holochain binaries, enable conductor auto-start)
          $embeddedProjects = @(
            "NextGenSoftware.Holochain.HoloNET.Client\NextGenSoftware.Holochain.HoloNET.Client.csproj",
            "NextGenSoftware.Holochain.HoloNET.ORM\NextGenSoftware.Holochain.HoloNET.ORM.csproj"
          )
          foreach ($proj in $embeddedProjects) {
            Write-Host "Packing $proj (embedded)..."
            dotnet pack $proj --configuration Release --output $nupkgsDir -p:Embedded=true -p:DefineConstants=EMBEDDED
            if ($LASTEXITCODE -eq 0) { $succeeded++ } else { $failed++; Write-Host "FAILED (embedded): $proj" }
          }

          Write-Host "Pack complete: $succeeded succeeded, $failed failed"
          if ($failed -gt 0) { exit 1 }

      - name: Push all packages to NuGet.org
        shell: pwsh
        run: |
          $pushFailed = 0
          Get-ChildItem -Path .\nupkgs\*.nupkg | ForEach-Object {
            Write-Host "Pushing $($_.Name)..."
            dotnet nuget push $_.FullName `
              --source https://api.nuget.org/v3/index.json `
              --api-key ${{ secrets.NUGET_API_KEY }} `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { $pushFailed++ }
          }
          if ($pushFailed -gt 0) { exit 1 }
