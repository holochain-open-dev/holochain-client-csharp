name: Publish NuGet Packages

on:
  workflow_dispatch:

concurrency:
  group: holonet-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}

      - name: Checkout NextGenSoftware-Libraries
        uses: actions/checkout@v4
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          path: NextGenSoftware-Libraries

      - name: Create Libraries symlink for project references
        shell: pwsh
        run: |
          # Project references use ../../NextGenSoftware-Libraries (works locally where repos are siblings).
          # On GitHub Actions the Libraries checkout lands inside GITHUB_WORKSPACE, so we create a
          # symlink one level up so the same relative path resolves on both local and CI.
          New-Item -ItemType SymbolicLink -Path "..\NextGenSoftware-Libraries" -Target "$env:GITHUB_WORKSPACE\NextGenSoftware-Libraries"
          Write-Host "Symlink created: ..\NextGenSoftware-Libraries -> $env:GITHUB_WORKSPACE\NextGenSoftware-Libraries"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Everything below is driven by packages.json (the one list of every package): see scripts/holonet_packages.py and docs/packages.md.
      # Nothing here names a project, so a new library or variant can't be forgotten.
      - name: Check the package manifest against the repository
        run: python scripts/holonet_packages.py check

      - name: Build and pack every package (every library x every variant, plus the templates)
        run: python scripts/holonet_packages.py pack nupkgs

      - name: Verify the packed packages
        run: python scripts/holonet_packages.py verify-packed nupkgs

      - name: Smoke test - install every library package into a fresh app and build it
        run: python scripts/holonet_packages.py smoke nupkgs

      - name: Verify release notes in every package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content packages.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid package version' }
          $tag = "v$version"
          $main = Get-Content CHANGELOG.md -Raw
          $heading = '(?ms)^## ' + [regex]::Escape($tag) + ' - [^\r\n]+\r?\n(.*?)(?=^## |\z)'
          $section = [regex]::Match($main, $heading)
          if (!$section.Success -or !$section.Groups[1].Value.Trim()) { throw "Missing release notes for $tag" }
          $notes = Join-Path $env:RUNNER_TEMP 'holonet-release-notes.md'
          Set-Content -LiteralPath $notes -Value $section.Groups[1].Value.Trim() -Encoding utf8
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expected = $section.Groups[1].Value.Trim().Replace("`r`n", "`n")
          foreach ($package in Get-ChildItem -LiteralPath nupkgs -Filter '*.nupkg' -File) {
            $zip = [IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $entry = $zip.Entries | Where-Object Name -like '*.nuspec' | Select-Object -First 1
              if (!$entry) { throw "Missing package manifest in $($package.Name)" }
              $reader = [IO.StreamReader]::new($entry.Open())
              try { [xml]$metadata = $reader.ReadToEnd() } finally { $reader.Dispose() }
              $actual = [string]$metadata.package.metadata.releaseNotes
              if (!$actual.Replace("`r`n", "`n").Contains($expected)) {
                throw "Release notes do not match the changelog in $($package.Name)"
              }
            } finally { $zip.Dispose() }
          }
          git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -ne 2) { throw "Expected the unpublished tag $tag" }

      - name: Push all packages to NuGet.org
        shell: pwsh
        run: |
          $pushFailed = 0
          Get-ChildItem -Path nupkgs/*.nupkg | ForEach-Object {
            Write-Host "Pushing $($_.Name)..."
            dotnet nuget push $_.FullName `
              --source https://api.nuget.org/v3/index.json `
              --api-key ${{ secrets.NUGET_API_KEY }} `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { $pushFailed++ }
          }
          if ($pushFailed -gt 0) { exit 1 }

      - name: Verify every package is on NuGet.org at this version
        run: python scripts/holonet_packages.py verify-nuget --wait 30

      - name: Publish the GitHub release with the verified NuGet packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content packages.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $notes = Join-Path $env:RUNNER_TEMP 'holonet-release-notes.md'
          $packages = @(Get-ChildItem -LiteralPath nupkgs -Filter '*.nupkg' -File | ForEach-Object FullName)
          if (!$packages.Count) { throw 'No verified packages to upload' }
          gh release create $tag @packages --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "HoloNET $version" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
