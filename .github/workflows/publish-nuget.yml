name: Publish NuGet Packages

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}

      - name: Checkout NextGenSoftware-Libraries
        uses: actions/checkout@v4
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          path: NextGenSoftware-Libraries

      - name: Create Libraries symlink for project references
        shell: pwsh
        run: |
          # Project references use ../../NextGenSoftware-Libraries (works locally where repos are siblings).
          # On GitHub Actions the Libraries checkout lands inside GITHUB_WORKSPACE, so we create a
          # symlink one level up so the same relative path resolves on both local and CI.
          New-Item -ItemType SymbolicLink -Path "..\NextGenSoftware-Libraries" -Target "$env:GITHUB_WORKSPACE\NextGenSoftware-Libraries"
          Write-Host "Symlink created: ..\NextGenSoftware-Libraries -> $env:GITHUB_WORKSPACE\NextGenSoftware-Libraries"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Everything below is driven by packages.json (the one list of every package): see scripts/holonet_packages.py and docs/packages.md.
      # Nothing here names a project, so a new library or variant can't be forgotten.
      - name: Check the package manifest against the repository
        run: python scripts/holonet_packages.py check

      - name: Build and pack every package (every library x every variant, plus the templates)
        run: python scripts/holonet_packages.py pack nupkgs

      - name: Verify the packed packages
        run: python scripts/holonet_packages.py verify-packed nupkgs

      - name: Smoke test - install every library package into a fresh app and build it
        run: python scripts/holonet_packages.py smoke nupkgs

      - name: Push all packages to NuGet.org
        shell: pwsh
        run: |
          $pushFailed = 0
          Get-ChildItem -Path nupkgs/*.nupkg | ForEach-Object {
            Write-Host "Pushing $($_.Name)..."
            dotnet nuget push $_.FullName `
              --source https://api.nuget.org/v3/index.json `
              --api-key ${{ secrets.NUGET_API_KEY }} `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { $pushFailed++ }
          }
          if ($pushFailed -gt 0) { exit 1 }

      - name: Verify every package is on NuGet.org at this version
        run: python scripts/holonet_packages.py verify-nuget --wait 30
