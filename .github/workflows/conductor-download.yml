name: Conductor download

# Proves HoloNET (HoloNETDNA.AutoDownloadConductor) can download, start and connect to a Holochain conductor on a computer with none installed,
# on Linux, macOS (Apple Silicon) and Windows. Needs no secrets: HoloNET's Client and the public NextGenSoftware-Libraries are all it builds.

on:
  workflow_dispatch:
    inputs:
      holochain_version:
        description: Holochain release to download
        default: '0.7.1'
  push:
    paths:
      - 'NextGenSoftware.Holochain.HoloNET.Client/**'
      - 'tools/ConductorDownloadSmoke/**'
      - '.github/workflows/conductor-download.yml'

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: holochain-client-csharp
      - uses: actions/checkout@v4
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          path: NextGenSoftware-Libraries
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download, start and connect
        working-directory: holochain-client-csharp
        shell: bash
        run: dotnet run --project tools/ConductorDownloadSmoke -c Release -- "${{ github.event.inputs.holochain_version || '0.7.1' }}"
